# ── Data parameters ───────────────────────────
data:
  lookback_days: 1500
  shock_lookback_days: 63
  min_observations: 120
  risk_free_rate_ticker: "^IRX"
  min_avg_daily_volume_usd: 500000   # ADV liquidity filter (USD) for backtest engine

# ── Beta estimation ───────────────────────────
beta:
  rolling_window: 252
  min_r_squared: 0.08
  outlier_zscore_threshold: 3.5
  ewma_halflife_days: 63            # EWMA decay halflife (days)
  use_ewma: true                    # EWMA weighting vs equal-weight rolling
  use_market_adjusted: true         # Frisch-Waugh market-adjusted beta

# ── Fundamental adjustment ────────────────────
fundamental:
  default_tax_rate: 0.21
  leverage_weight: 0.4
  margin_weight: 0.3
  coverage_weight: 0.3

# ── Shock detection ───────────────────────────
shock:
  min_amplitude_pct: 1.5
  min_zscore: 2.0
  lookback_vol_days: 63
  speed_decay: 0.7
  max_age_days: 5
  max_accumulation_days: 3          # Scan 1/2/3-day accumulated shock windows

# ── Alpha thresholds ──────────────────────────
alpha:
  min_alpha_pct: 1.5                # 1.5% minimum gap (2.0 was filtering too much)
  max_alpha_pct: 15.0
  decay_halflife_days: 3
  already_priced_ratio: 0.75        # Take profit at 75% alpha captured (was 0.85)

# ── Scoring weights ───────────────────────────
scoring:
  alpha_weight: 0.40
  shock_weight: 0.20
  leverage_quality_weight: 0.15
  margin_quality_weight: 0.15
  timing_weight: 0.10
  min_score_to_trade: 0.45
  min_display_score: 0.30

# ── Risk management ───────────────────────────
risk:
  # Hard position limits
  max_position_pct: 0.06          # ↑ 6% per position (from 4%) — bigger bets on good signals
  min_position_pct: 0.005
  max_commodity_exposure: 0.25    # ↑ 25% (from 18%) — more room for Silver/Copper
  max_holding_days: 12

  # ── Per-commodity hard caps ───────────────────
  commodity_exposure_overrides:
    natural_gas: 0.0              # DISABLED — Sharpe -9.91, pure P&L drain
    gold: 0.04                    # Hard cap 4% — Sharpe -5.30, weak beta model

  # ── Exit rules ─────────────────────────────────
  stop_loss_pct: 0.03             # ↓ 3% (from 4%) — cut losers 25% faster

  # ── CML + risk-parity sizing parameters ──────
  # Position size = base_size × boost × composite_score
  # where:
  #   base_size = target_position_risk_pct / sigma_residual_annual  (inverse vol)
  #   boost     = min(SR_signal / reference_sharpe, max_signal_boost)
  target_position_risk_pct: 0.015 # ↑ 1.5% target vol → larger base positions
  reference_sharpe: 0.50          # Boost = 1× at SR=0.50, 2× at SR=1.0
  max_signal_boost: 3.0           # ↑ 3× boost — reward high-conviction signals more

  # ── Rebalancing ────────────────────────────────
  # Re-evaluate every open position every N trading days.
  # 21 trading days ≈ 1 calendar month.
  # At each rebalance: adjust size in-place, replace TP/SL from current price.
  # Never close + reopen — only mutate the existing position.
  rebalancing_frequency_days: 5
  min_cross_commodity_beta: 0.25

  # ── Portfolio drawdown circuit breaker ────────
  # Block ALL new entries if combined P&L dropped >threshold over last N days.
  # Prevents cascading losses when macro stress collapses all correlations.
  drawdown_circuit_window_days: 5   # Rolling window (trading days)
  drawdown_circuit_stop_pct: 0.015  # 1.5% portfolio loss in window → risk-off

  # ── Regime filter ─────────────────────────────
  # Block new entries when market is risk-off (correlations collapse alpha).
  # VIX > threshold = fear elevated; correl > threshold = market dominates all moves.
  regime_vix_threshold: 20.0       # ↓ 20 — earlier protection against macro stress
  regime_correl_threshold: 0.70     # |rolling correl(SPY, avg commodity)| > this = risk-off
  regime_correl_window: 30          # ↑ Smoother estimate (from 20 days)

  # ── Concentration cap ─────────────────────────
  # Prevents hidden concentration: 15 crude-oil LONGs on the same shock ≠ diversification.
  # Only the top N signals (sorted by |alpha| × shock_score) are opened per commodity shock.
  max_positions_per_shock: 2        # ↓ from 3 — only the 2 best signals per shock

  # ── Vol-adjusted stop-loss ────────────────────
  # Stop = max(fixed_stop_loss_pct, atr_multiplier × 14d_daily_vol).
  # Gives high-vol stocks more room; avoids stopping out on normal noise.
  atr_stop_multiplier: 2.0          # N × 14-day rolling daily vol
  max_atr_stop_pct: 0.12            # Hard cap on vol-adjusted stop (12%)

  # ── Sharpe-weighted NAV allocation ────────────
  # Commodity with Sharpe 1.5 gets more capital than one with Sharpe 0.4.
  # Exposure scaled around base max_commodity_exposure using rolling 63-day Sharpe.
  # floor: never below 25% of base; cap: never above 2× base (anti-concentration).
  sharpe_weight_floor: 0.10         # ↓ from 0.25 — really cut underperforming commodities
  sharpe_weight_cap: 3.0            # ↑ from 2.0 — more capital to proven winners

  # ── Momentum pre-filter ───────────────────────
  # Reject LONG if stock dropped >15% in N days (likely fundamental issue, not lag).
  # Reject SHORT if stock rallied >15% in N days.
  momentum_lookback_days: 5
  momentum_max_adverse_pct: 0.15

# ── Execution (live trading / IBKR) ───────────
execution:
  # Portfolio NAV in USD — used to compute whole-share quantities.
  # Update this before each live run to reflect your actual account value.
  nav_total: 10000

  # IBKR does not support fractional shares via API.
  # When floor(target_dollars / price) == 0, the signal goes to manual_orders report.
  ibkr_fractional_shares: false

  # Orders with target notional below this threshold go to manual report.
  # (Avoids placing very small odd-lot orders)
  min_order_notional_usd: 100

  # Per-side slippage estimate (half-spread model).
  # Applied on entry AND exit: entry_price × (1 ± slip), exit_price × (1 ∓ slip).
  # 0.001 = 10 bps per side (20 bps round-trip) — conservative for mid-large caps.
  slippage_pct: 0.001

  # ADV liquidity filter: skip a signal if the target position notional
  # exceeds this fraction of the stock's 20-day average daily volume in USD.
  # 0.05 = position must be ≤ 5% of 20-day ADV.
  adv_filter_pct: 0.05

  # Transaction costs — passed to backtest engine as slippage per leg.
  # 10 bps / 2 = 5 bps per leg (conservative estimate for liquid mid/large-caps).
  transaction_cost_bps: 10

# ── Output ────────────────────────────────────
output:
  top_n_signals: 10
  min_display_score: 0.30
