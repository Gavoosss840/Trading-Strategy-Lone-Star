# ── Data parameters ───────────────────────────
data:
  lookback_days: 504          # ~2 years for beta estimation
  shock_lookback_days: 63     # ~3 months for volatility baseline
  min_observations: 120       # Minimum data points for regression
  risk_free_rate_ticker: "^IRX"   # 13-week T-Bill

# ── Beta estimation ───────────────────────────
beta:
  rolling_window: 252         # 1 year rolling window
  min_r_squared: 0.05         # Minimum R² to consider beta meaningful
  outlier_zscore_threshold: 3.5  # Remove outlier returns above this z-score

# ── Fundamental adjustment ────────────────────
fundamental:
  default_tax_rate: 0.21      # US corporate tax rate
  leverage_weight: 0.4
  margin_weight: 0.3
  coverage_weight: 0.3

# ── Shock detection ───────────────────────────
shock:
  min_amplitude_pct: 1.5
  min_zscore: 1.5
  lookback_vol_days: 63
  speed_decay: 0.7
  max_age_days: 5

# ── Alpha thresholds ──────────────────────────
alpha:
  min_alpha_pct: 0.5
  max_alpha_pct: 15.0
  decay_halflife_days: 3
  already_priced_ratio: 0.85

# ── Scoring weights ───────────────────────────
scoring:
  alpha_weight: 0.40
  shock_weight: 0.20
  leverage_quality_weight: 0.15
  margin_quality_weight: 0.15
  timing_weight: 0.10
  min_score_to_trade: 0.45
  min_display_score: 0.30

# ── Risk management ───────────────────────────
risk:
  max_position_pct: 0.05
  max_commodity_exposure: 0.20
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  max_holding_days: 10

# ── Output ────────────────────────────────────
output:
  top_n_signals: 10
  min_display_score: 0.30
