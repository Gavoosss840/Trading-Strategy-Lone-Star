    - { ticker: "EQNR",  name: "Equinor (NO)",         primary_commodity: crude_oil,   role: producer }
    # Mining — producers
    - { ticker: "RIO",   name: "Rio Tinto (UK/AU)",    primary_commodity: copper,      role: producer }
    - { ticker: "GLNCY", name: "Glencore ADR (CH)",    primary_commodity: copper,      role: producer }
    - { ticker: "NGLOY", name: "Anglo American ADR (UK)", primary_commodity: copper,   role: producer }
    # Natural gas — consumers (chemicals)
    - { ticker: "BASFY", name: "BASF ADR (DE)",        primary_commodity: natural_gas, role: consumer }
    # Copper — consumers (industrial)
    - { ticker: "SIEGY", name: "Siemens ADR (DE)",     primary_commodity: copper,      role: consumer }
    - { ticker: "VWAGY", name: "Volkswagen ADR (DE)",  primary_commodity: copper,      role: consumer }
    # Crude oil — consumers (airlines)
    - { ticker: "RYAAY", name: "Ryanair ADR (IE)",     primary_commodity: crude_oil,   role: consumer }
    - { ticker: "ICAGY", name: "IAG ADR (UK/ES)",      primary_commodity: crude_oil,   role: consumer }
    # Gold — consumers (luxury)
    - { ticker: "LVMHF", name: "LVMH ADR (FR)",        primary_commodity: gold,        role: consumer }

  # ────────────────────────────────────────────
  #  MIDDLE EAST
  #  Only Aramco (2222.SR) has reliable yfinance
  #  coverage on Tadawul. All other exchanges
  #  (.AD, .DU) are too sparse — excluded.
  # ────────────────────────────────────────────
  middle_east:
    - { ticker: "2222.SR", name: "Saudi Aramco (SA)",  primary_commodity: crude_oil,   role: producer }

  # ────────────────────────────────────────────
  #  ASIA / PACIFIC
  #  ASX (.AX), HK (.HK), Tokyo (.T), Seoul (.KS),
  #  Singapore (.SI) — all well-supported in yfinance.
  #  Removed: Chinese A-shares (.SZ/.SS),
  #           delisted Chinese NYSE ADRs (PTR, SHI).
  # ────────────────────────────────────────────
  asia_pacific:
    # Crude oil — producers
    - { ticker: "0883.HK", name: "CNOOC (HK)",         primary_commodity: crude_oil,   role: producer }
    - { ticker: "0857.HK", name: "PetroChina (HK)",    primary_commodity: crude_oil,   role: producer }
    - { ticker: "0386.HK", name: "Sinopec (HK)",       primary_commodity: crude_oil,   role: producer }
    # Natural gas — producers
    - { ticker: "WDS",     name: "Woodside Energy (AU)", primary_commodity: natural_gas, role: producer }
    - { ticker: "1088.HK", name: "China Shenhua (HK)", primary_commodity: natural_gas, role: producer }
    # Mining — producers
    - { ticker: "BHP",     name: "BHP Group (AU/NYSE)", primary_commodity: copper,      role: producer }
    - { ticker: "FMG.AX",  name: "Fortescue (ASX)",    primary_commodity: copper,      role: producer }
    # Gold — producer
    - { ticker: "NST.AX",  name: "Northern Star (ASX)", primary_commodity: gold,        role: producer }
    # Copper — consumers (auto/industrial)
    - { ticker: "TM",      name: "Toyota (JP/NYSE)",    primary_commodity: copper,      role: consumer }
    - { ticker: "HMC",     name: "Honda (JP/NYSE)",     primary_commodity: copper,      role: consumer }
    - { ticker: "STLA",    name: "Stellantis (IT/NYSE)", primary_commodity: copper,     role: consumer }
    - { ticker: "PKX",     name: "POSCO Holdings (KR/NYSE)", primary_commodity: copper, role: consumer }
    - { ticker: "005930.KS", name: "Samsung Electronics (KR)", primary_commodity: copper, role: consumer }
    # Crude oil — consumers (airlines)
    - { ticker: "9201.T",  name: "Japan Airlines (JP)", primary_commodity: crude_oil,   role: consumer }
    - { ticker: "9202.T",  name: "ANA Holdings (JP)",   primary_commodity: crude_oil,   role: consumer }
    - { ticker: "C6L.SI",  name: "Singapore Airlines (SG)", primary_commodity: crude_oil, role: consumer }
    - { ticker: "0293.HK", name: "Cathay Pacific (HK)", primary_commodity: crude_oil,   role: consumer }
    # Grains — consumers (food)
    - { ticker: "2802.T",  name: "Ajinomoto (JP)",      primary_commodity: corn,        role: consumer }
    - { ticker: "2897.T",  name: "Nissin Foods (JP)",   primary_commodity: wheat,       role: consumer }

# ── Data parameters ───────────────────────────
data:
  lookback_days: 504
  shock_lookback_days: 63
  min_observations: 120
  risk_free_rate_ticker: "^IRX"

# ── Beta estimation ───────────────────────────
beta:
  rolling_window: 252
  min_r_squared: 0.05
  outlier_zscore_threshold: 3.5

# ── Fundamental adjustment ────────────────────
fundamental:
  default_tax_rate: 0.21
  leverage_weight: 0.4
  margin_weight: 0.3
  coverage_weight: 0.3

# ── Shock detection ───────────────────────────
shock:
  min_amplitude_pct: 1.5
  min_zscore: 1.5
  lookback_vol_days: 63
  speed_decay: 0.7
  max_age_days: 5

# ── Alpha thresholds ──────────────────────────
alpha:
  min_alpha_pct: 0.5
  max_alpha_pct: 15.0
  decay_halflife_days: 3
  already_priced_ratio: 0.85

# ── Scoring weights ───────────────────────────
scoring:
  alpha_weight: 0.40
  shock_weight: 0.20
  leverage_quality_weight: 0.15
  margin_quality_weight: 0.15
  timing_weight: 0.10
  min_score_to_trade: 0.45
  min_display_score: 0.30

# ── Risk management ───────────────────────────
risk:
  max_position_pct: 0.05
  max_commodity_exposure: 0.20
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  max_holding_days: 10

# ── Output ────────────────────────────────────
output:
  top_n_signals: 10
  min_display_score: 0.30
