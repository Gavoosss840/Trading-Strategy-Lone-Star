    name: "Crude Oil"
    unit: "barrel"
  natural_gas:
    ticker: "NG=F"
    name: "Natural Gas"
    unit: "mmbtu"
  gold:
    ticker: "GC=F"
    name: "Gold"
    unit: "oz"
  silver:
    ticker: "SI=F"
    name: "Silver"
    unit: "oz"
  copper:
    ticker: "HG=F"
    name: "Copper"
    unit: "lb"
  wheat:
