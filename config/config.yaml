# ── Data parameters ───────────────────────────
data:
  lookback_days: 504
  shock_lookback_days: 63
  min_observations: 120
  risk_free_rate_ticker: "^IRX"

# ── Beta estimation ───────────────────────────
beta:
  rolling_window: 252
  min_r_squared: 0.05
  outlier_zscore_threshold: 3.5

# ── Fundamental adjustment ────────────────────
fundamental:
  default_tax_rate: 0.21
  leverage_weight: 0.4
  margin_weight: 0.3
  coverage_weight: 0.3

# ── Shock detection ───────────────────────────
shock:
  min_amplitude_pct: 1.5
  min_zscore: 1.5
  lookback_vol_days: 63
  speed_decay: 0.7
  max_age_days: 5

# ── Alpha thresholds ──────────────────────────
alpha:
  min_alpha_pct: 0.5
  max_alpha_pct: 15.0
  decay_halflife_days: 3
  already_priced_ratio: 0.85

# ── Scoring weights ───────────────────────────
scoring:
  alpha_weight: 0.40
  shock_weight: 0.20
  leverage_quality_weight: 0.15
  margin_quality_weight: 0.15
  timing_weight: 0.10
  min_score_to_trade: 0.45
  min_display_score: 0.30

# ── Risk management ───────────────────────────
risk:
  # Hard position limits
  max_position_pct: 0.05          # Maximum 5% per position
  min_position_pct: 0.005         # Minimum 0.5% (below → discard)
  max_commodity_exposure: 0.20    # Maximum 20% gross exposure per commodity
  max_holding_days: 10            # Force-close after 10 days

  # ── Exit rules ─────────────────────────────────
  # Take Profit: linked to α=0 fair value (price where shock is fully priced)
  #   LONG  → take_profit_price = entry × (1 + |alpha|)
  #   SHORT → take_profit_price = entry × (1 - |alpha|)
  #   No fixed % override needed — the signal itself defines the target.
  #
  # Stop Loss: max drawdown % from entry (Taurus-style fixed guard)
  stop_loss_pct: 0.05             # Stop loss at -5% from entry (max drawdown)

  # ── CML + risk-parity sizing parameters ──────
  # Position size = base_size × boost × composite_score
  # where:
  #   base_size = target_position_risk_pct / sigma_residual_annual  (inverse vol)
  #   boost     = min(SR_signal / reference_sharpe, max_signal_boost)
  target_position_risk_pct: 0.01  # Target 1% annual idiosyncratic vol per position
  reference_sharpe: 0.50          # Boost = 1× at SR=0.50, 2× at SR=1.0
  max_signal_boost: 2.0           # Cap boost at 2× (prevents over-concentration)

# ── Output ────────────────────────────────────
output:
  top_n_signals: 10
  min_display_score: 0.30
