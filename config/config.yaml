# ─────────────────────────────────────────────
#  LONE STAR — Strategy Configuration
# ─────────────────────────────────────────────

# ── Commodities universe ──────────────────────
commodities:
  crude_oil:
    ticker: "CL=F"
    name: "Crude Oil"
    unit: "barrel"
  natural_gas:
    ticker: "NG=F"
    name: "Natural Gas"
    unit: "mmbtu"
  gold:
    ticker: "GC=F"
    name: "Gold"
    unit: "oz"
  silver:
    ticker: "SI=F"
    name: "Silver"
    unit: "oz"
  copper:
    ticker: "HG=F"
    name: "Copper"
    unit: "lb"
  wheat:
    ticker: "ZW=F"
    name: "Wheat"
    unit: "bushel"
  corn:
    ticker: "ZC=F"
    name: "Corn"
    unit: "bushel"
  soybeans:
    ticker: "ZS=F"
    name: "Soybeans"
    unit: "bushel"

# ── Stock universe — by geographic zone ───────
# Criteria: NYSE/NASDAQ primary listing OR liquid ADR/HK/JP/KR/ASX tickers
# that yfinance covers reliably with 2+ years of daily data.
# Removed: Abu Dhabi (.AD), Dubai (.DU), Shanghai A-shares (.SZ),
#          delisted Chinese ADRs (PTR, SHI), illiquid OTC names.
stocks:

  # ────────────────────────────────────────────
  #  AMERICAS  (NYSE / NASDAQ — most reliable)
  # ────────────────────────────────────────────
  americas:
    # Crude oil — producers
    - { ticker: "XOM",  name: "ExxonMobil",          primary_commodity: crude_oil,   role: producer }
    - { ticker: "CVX",  name: "Chevron",              primary_commodity: crude_oil,   role: producer }
    - { ticker: "COP",  name: "ConocoPhillips",       primary_commodity: crude_oil,   role: producer }
    - { ticker: "EOG",  name: "EOG Resources",        primary_commodity: crude_oil,   role: producer }
    - { ticker: "SLB",  name: "SLB",                  primary_commodity: crude_oil,   role: producer }
    - { ticker: "MPC",  name: "Marathon Petroleum",   primary_commodity: crude_oil,   role: producer }
    - { ticker: "VLO",  name: "Valero Energy",        primary_commodity: crude_oil,   role: producer }
    - { ticker: "PBR",  name: "Petrobras (Brazil)",   primary_commodity: crude_oil,   role: producer }
    # Natural gas — producers
    - { ticker: "EQT",  name: "EQT Corp",             primary_commodity: natural_gas, role: producer }
    - { ticker: "AR",   name: "Antero Resources",     primary_commodity: natural_gas, role: producer }
    # Gold — producers
    - { ticker: "NEM",  name: "Newmont",              primary_commodity: gold,        role: producer }
    - { ticker: "GOLD", name: "Barrick Gold",         primary_commodity: gold,        role: producer }
    - { ticker: "AEM",  name: "Agnico Eagle",         primary_commodity: gold,        role: producer }
    - { ticker: "KGC",  name: "Kinross Gold",         primary_commodity: gold,        role: producer }
    - { ticker: "WPM",  name: "Wheaton Precious Metals", primary_commodity: gold,     role: producer }
    # Copper — producers
    - { ticker: "FCX",  name: "Freeport-McMoRan",     primary_commodity: copper,      role: producer }
    - { ticker: "SCCO", name: "Southern Copper",      primary_commodity: copper,      role: producer }
    - { ticker: "VALE", name: "Vale S.A. (Brazil)",   primary_commodity: copper,      role: producer }
    # Grains — producers / traders
    - { ticker: "ADM",  name: "Archer-Daniels-Midland", primary_commodity: corn,      role: producer }
    - { ticker: "BG",   name: "Bunge Global",         primary_commodity: soybeans,    role: producer }
    - { ticker: "MOS",  name: "Mosaic Company",       primary_commodity: corn,        role: producer }
    # Crude oil — consumers
    - { ticker: "AAL",  name: "American Airlines",    primary_commodity: crude_oil,   role: consumer }
    - { ticker: "DAL",  name: "Delta Air Lines",      primary_commodity: crude_oil,   role: consumer }
    - { ticker: "UAL",  name: "United Airlines",      primary_commodity: crude_oil,   role: consumer }
    - { ticker: "FDX",  name: "FedEx",                primary_commodity: crude_oil,   role: consumer }
    - { ticker: "UPS",  name: "UPS",                  primary_commodity: crude_oil,   role: consumer }
    # Natural gas — consumers (petrochemicals)
    - { ticker: "DOW",  name: "Dow Inc.",             primary_commodity: natural_gas, role: consumer }
    - { ticker: "LYB",  name: "LyondellBasell",       primary_commodity: natural_gas, role: consumer }
    # Copper — consumers
    - { ticker: "ETN",  name: "Eaton",                primary_commodity: copper,      role: consumer }
    - { ticker: "WHR",  name: "Whirlpool",            primary_commodity: copper,      role: consumer }
    # Grains — consumers (food processing)
    - { ticker: "GIS",  name: "General Mills",        primary_commodity: wheat,       role: consumer }
    - { ticker: "K",    name: "Kellanova",            primary_commodity: wheat,       role: consumer }
    - { ticker: "TSN",  name: "Tyson Foods",          primary_commodity: corn,        role: consumer }
    - { ticker: "HRL",  name: "Hormel Foods",         primary_commodity: corn,        role: consumer }
    - { ticker: "CAG",  name: "Conagra Brands",       primary_commodity: soybeans,    role: consumer }

  # ────────────────────────────────────────────
  #  EUROPE  (NYSE-listed or liquid OTC ADRs)
  #  Note: OTC ADRs (BASFY, SIEGY…) have full
  #  yfinance history and reasonable volume.
  # ────────────────────────────────────────────
  europe:
    # Crude oil — producers
    - { ticker: "BP",    name: "BP (UK)",              primary_commodity: crude_oil,   role: producer }
    - { ticker: "SHEL",  name: "Shell (UK/NL)",        primary_commodity: crude_oil,   role: producer }
